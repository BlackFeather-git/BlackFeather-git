<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="50%" stop-color="#0e131f"/>
      <stop offset="100%" stop-color="#080b11"/>
    </linearGradient>

    <!-- Subtle Accent Glow -->
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="border" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Pill Gradient -->
    <linearGradient id="pillBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131b2a"/>
      <stop offset="100%" stop-color="#0f1724"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  </style>

  <!-- Base Card -->
  <rect width="900" height="220" rx="14" fill="url(#bg)"/>
  <rect width="900" height="220" rx="14" fill="url(#glow)"/>
  <rect width="898" height="218" x="1" y="1" rx="13" stroke="url(#border)" stroke-width="1.5"/>

  <!-- Left Accent Bar -->
  <rect x="0" y="30" width="4" height="60" rx="2" fill="#38bdf8"/>

  <!-- Top System Tag Pill -->
  <g transform="translate(42, 34)">
    <rect width="210" height="24" rx="12" fill="url(#pillBg)" stroke="#1e293b" stroke-width="1"/>
    <circle cx="12" cy="12" r="4" fill="#22c55e"/>
    <text x="24" y="16" class="font-mono" font-size="10.5" fill="#94a3b8" letter-spacing="0.5">ARCH LINUX • HYPRLAND</text>
  </g>

  <!-- Identity Title -->
  <text x="42" y="98" class="font-sans" font-size="34" font-weight="700" fill="#f8fafc" letter-spacing="-0.5">Amish</text>
  <text x="160" y="96" class="font-mono" font-size="14" font-weight="500" fill="#38bdf8">@BlackFeather-git</text>

  <!-- Role Subtitle -->
  <text x="42" y="126" class="font-sans" font-size="14.5" fill="#94a3b8">
    Systems Architecture &amp; Native Interface Design
  </text>

  <!-- Technology Badges Row -->
  <g transform="translate(42, 154)">
    <!-- C / Kernel -->
    <g transform="translate(0, 0)">
      <rect width="94" height="26" rx="6" fill="#131b29" stroke="#1e293b" stroke-width="1"/>
      <text x="47" y="17" class="font-mono" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">Kernel (C)</text>
    </g>
    <!-- Rust -->
    <g transform="translate(102, 0)">
      <rect width="64" height="26" rx="6" fill="#131b29" stroke="#1e293b" stroke-width="1"/>
      <text x="32" y="17" class="font-mono" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">Rust</text>
    </g>
    <!-- Python -->
    <g transform="translate(174, 0)">
      <rect width="78" height="26" rx="6" fill="#131b29" stroke="#1e293b" stroke-width="1"/>
      <text x="39" y="17" class="font-mono" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">Python</text>
    </g>
    <!-- Kotlin / Compose -->
    <g transform="translate(260, 0)">
      <rect width="140" height="26" rx="6" fill="#131b29" stroke="#1e293b" stroke-width="1"/>
      <text x="70" y="17" class="font-mono" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">Kotlin • Compose</text>
    </g>
    <!-- Material 3 -->
    <g transform="translate(408, 0)">
      <rect width="102" height="26" rx="6" fill="#131b29" stroke="#1e293b" stroke-width="1"/>
      <text x="51" y="17" class="font-mono" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">Material 3</text>
    </g>
  </g>

  <!-- Right Decorative Terminal Box (Fastfetch Minimalist Card) -->
  <g transform="translate(560, 28)">
    <rect width="300" height="164" rx="8" fill="#080c14" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Terminal Titlebar -->
    <rect width="300" height="24" rx="8" fill="#0f1622"/>
    <circle cx="12" cy="12" r="3.5" fill="#ef4444"/>
    <circle cx="23" cy="12" r="3.5" fill="#eab308"/>
    <circle cx="34" cy="12" r="3.5" fill="#22c55e"/>
    <text x="46" y="15" class="font-mono" font-size="9.5" fill="#64748b">amish@cachyos (wayland)</text>

    <!-- Terminal Content (Clean Fastfetch Style) -->
    <text x="16" y="48" class="font-mono" font-size="11" fill="#38bdf8">OS</text>
    <text x="80" y="48" class="font-mono" font-size="11" fill="#94a3b8">: Arch Linux / CachyOS</text>

    <text x="16" y="68" class="font-mono" font-size="11" fill="#38bdf8">WM</text>
    <text x="80" y="68" class="font-mono" font-size="11" fill="#94a3b8">: Hyprland (Wayland)</text>

    <text x="16" y="88" class="font-mono" font-size="11" fill="#38bdf8">Core</text>
    <text x="80" y="88" class="font-mono" font-size="11" fill="#94a3b8">: Linux 7.2.x • x86_64</text>

    <text x="16" y="108" class="font-mono" font-size="11" fill="#38bdf8">Stance</text>
    <text x="80" y="108" class="font-mono" font-size="11" fill="#94a3b8">: Strictly Anti-Electron</text>

    <text x="16" y="128" class="font-mono" font-size="11" fill="#38bdf8">Ergo</text>
    <text x="80" y="128" class="font-mono" font-size="11" fill="#94a3b8">: Expressive Material 3</text>

    <text x="16" y="148" class="font-mono" font-size="11" fill="#22c55e">➜</text>
    <text x="32" y="148" class="font-mono" font-size="11" fill="#22c55e">status: active</text>
  </g>
</svg>
