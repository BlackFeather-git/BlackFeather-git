<svg xmlns="http://www.w3.org/2000/svg" width="840" height="220" viewBox="0 0 840 220" role="img" aria-label="Amish - BlackFeather Profile Header">
  <title>Amish - BlackFeather Profile Header</title>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="100%" stop-color="#12161f" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .heading { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .prompt { fill: #38bdf8; font-weight: 600; font-size: 13px; }
    .cmd { fill: #f1f5f9; font-size: 13px; }
    .res { fill: #94a3b8; font-size: 12px; }
    .title-text { fill: #64748b; font-size: 11px; }
  </style>

  <clipPath id="headerClip">
    <rect width="840" height="220" rx="10" />
  </clipPath>

  <g clip-path="url(#headerClip)">
    <rect width="840" height="220" fill="url(#bgGrad)" />
    <rect width="840" height="34" fill="#12161f" />
    <circle cx="14" cy="17" r="5" fill="#ef4444" />
    <circle cx="30" cy="17" r="5" fill="#eab308" />
    <circle cx="46" cy="17" r="5" fill="#22c55e" />
    <text x="68" y="21" class="mono title-text">amish@cachyos-hyprland ~ (wayland)</text>

    <text x="24" y="66" class="heading" font-size="22" fill="#ffffff">Amish</text>
    <text x="96" y="66" class="mono" font-size="13" fill="#38bdf8" font-weight="600">(BlackFeather)</text>

    <text x="24" y="98" class="mono" font-size="12" fill="#38bdf8" font-weight="600">Focus   : </text>
    <text x="105" y="98" class="mono" font-size="12" fill="#e2e8f0">Native Applications  •  Linux Kernel Modules  •  Fluid Motion</text>

    <text x="24" y="124" class="mono" font-size="12" fill="#38bdf8" font-weight="600">Design  : </text>
    <text x="105" y="124" class="mono" font-size="12" fill="#e2e8f0">Expressive Material 3  •  Calibrated Physics  •  Zero Bloat</text>

    <text x="24" y="150" class="mono" font-size="12" fill="#38bdf8" font-weight="600">System  : </text>
    <text x="105" y="150" class="mono" font-size="12" fill="#94a3b8">Arch Linux / CachyOS (x86_64)  •  Hyprland (Wayland)  •  Rust / C / Python</text>

    <text x="24" y="184" class="mono prompt">➜</text>
    <text x="42" y="184" class="mono" font-size="13" fill="#a855f7" font-weight="600">~</text>
    <text x="60" y="184" class="mono" font-size="13" fill="#22c55e">status --ready</text>
  </g>

  <rect width="840" height="220" rx="10" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />
</svg>
