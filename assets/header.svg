<svg xmlns="http://www.w3.org/2000/svg" width="840" height="260" viewBox="0 0 840 260" role="img" aria-label="Amish - BlackFeather Profile Header">
  <title>Amish - BlackFeather Profile Header</title>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="100%" stop-color="#12161f" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.6"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1f242e" stroke-width="0.75" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .heading { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .prompt { fill: #38bdf8; font-weight: 600; font-size: 13px; }
    .cmd { fill: #f1f5f9; font-size: 13px; }
    .res { fill: #94a3b8; font-size: 12px; }
    .accent { fill: #38bdf8; }
    .green { fill: #22c55e; }
    .title-text { fill: #64748b; font-size: 11px; }
  </style>

  <clipPath id="headerClip">
    <rect width="840" height="260" rx="12" />
  </clipPath>

  <g clip-path="url(#headerClip)">
    <!-- Base Background -->
    <rect width="840" height="260" fill="url(#bgGrad)" />
    <rect width="840" height="260" fill="url(#grid)" opacity="0.45" />

    <!-- Title Bar -->
    <rect width="840" height="38" fill="#161b22" />
    <circle cx="20" cy="19" r="5" fill="#ef4444" />
    <circle cx="36" cy="19" r="5" fill="#eab308" />
    <circle cx="52" cy="19" r="5" fill="#22c55e" />
    <text x="74" y="23" class="mono title-text">amish@cachyos-hyprland ~ (wayland)</text>

    <!-- Main Header Identity -->
    <text x="32" y="80" class="heading" font-size="30" fill="#ffffff" letter-spacing="0.5">AMISH</text>
    <text x="145" y="80" class="mono" font-size="14" fill="#38bdf8" font-weight="600">/ BlackFeather</text>

    <text x="32" y="104" class="mono" font-size="12" fill="#94a3b8">Systems Architecture  •  Hardware Reverse Engineering  •  Native Fluid UI</text>

    <!-- Divider Line -->
    <line x1="32" y1="120" x2="808" y2="120" stroke="#242b35" stroke-width="1" />

    <!-- Interactive Terminal Prompts -->
    <text x="32" y="146" class="mono prompt">➜</text>
    <text x="48" y="146" class="mono cmd">sysinfo</text>
    <text x="32" y="168" class="mono res">OS: Arch Linux / CachyOS (x86_64)  |  WM: Hyprland (Wayland)  |  Kernel: 7.2.x</text>
    <text x="32" y="188" class="mono res">Stance: Strictly Anti-Electron  |  Fluid Material 3  |  Zero-Telemetry Native Tools</text>

    <text x="32" y="218" class="mono prompt">➜</text>
    <text x="48" y="218" class="mono cmd">core.domains</text>
    <text x="32" y="238" class="mono res">Linux Kernel Modules (C)  •  BLE GATT Telemetry  •  Rust Tooling  •  Kotlin / Compose</text>
  </g>

  <!-- Frame Border with subtle gradient -->
  <rect width="840" height="260" rx="12" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />
</svg>
